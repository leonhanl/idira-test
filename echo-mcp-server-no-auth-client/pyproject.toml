[project]
name = "echo-mcp-server-no-auth-client"
version = "0.1.0"
description = "Dedicated CyberArk Gateway client for the unauthenticated Echo MCP server"
requires-python = ">=3.10"
dependencies = [
    "httpx2>=2.5.0",
    "mcp==2.2.0",
    "pydantic>=2.11.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
]

[tool.pyright]
include = ["main.py"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
